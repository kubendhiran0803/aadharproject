apiVersion: v1
kind: PersistentVolume
metadata:
  name: adharpod2-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /tmp/adharpod2-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adharpod2-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 5Gi
